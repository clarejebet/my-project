<html>
 <head>
 <title>Tables</title>
 <style>
    body{
        margin: 0;
    }
    table{
        border: none;
        margin: 0;
        border-collapse: collapse;
    }
    th, td {
        border: none;
    }
 </style>
 </head>
 <body>
 <table border="5">
 <caption> <b>
 Timetable
 </b> </caption>
 <tr>
 <th scope="col">Day/Time</th>
 <th>9am</th>
 <th>10am</th>
 <th>11am</th>
 <th>12pm</th>
 </tr>
 <tr>
 <th scope="row">Monday</th>
 <td colspan="2">CIS 210</td>
 <td>CIS 211</td>
 <td>CIS 212</td>
 
 </tr>
 <tr>
 <th scope="row">Tuesday</th>
 <td>CIS 122</td>
 <td>CIS 133</td>
 <td colspan="2">CIS 213</td>
 </tr>
 </table>
 </body>
 </html>
